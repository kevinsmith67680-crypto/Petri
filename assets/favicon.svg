<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="engulfs">
  <!-- Deliberately not the full mark. At 16px the two eyes and five orbs of
       the header logo collapse into noise, so this keeps one eye, two orbs and
       a much wider mouth — the silhouette is the only thing that survives at
       favicon size, and it is what has to read. -->
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a34ee8"/>
      <stop offset="1" stop-color="#f92a94"/>
    </linearGradient>
  </defs>
  <path fill="url(#f)" d="M28 32 L48.5 16 A26 26 0 1 0 48.5 48 Z"/>
  <circle cx="30" cy="20" r="6" fill="#fff"/>
  <circle cx="31.5" cy="20.5" r="3.5" fill="#141433"/>
  <circle cx="56" cy="26" r="5" fill="#ffc82e"/>
  <circle cx="54" cy="45" r="4" fill="#29b6f6"/>
</svg>
