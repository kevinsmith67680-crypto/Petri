# Render Blueprint.
#
# IMPORTANT: this file can overwrite the dashboard. If you have upgraded the
# instance by hand and this still said `plan: free`, re-syncing the blueprint
# would put you back on the free tier — where 100 bots at 20Hz used 84% of the
# tick budget and the service slept after 15 minutes idle.
services:
  - type: web
    name: petri
    runtime: node
    # Standard: 1 CPU, 2GB, no spin-down. The free tier's 0.1 CPU cannot hold
    # a 20Hz tick with a full room.
    plan: standard
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      # Render terminates TLS in front of the app, so client IPs arrive in
      # X-Forwarded-For. Without this every player looks like one address and
      # MAX_CONN_PER_IP locks out all but three of them.
      - key: TRUST_PROXY
        value: "1"

      # 30Hz halves how stale other players look (85ms -> 57ms) and costs 13%
      # of one CPU with a full room. Do not raise this on a free instance.
      - key: TICK_HZ
        value: "30"

      # BOTS is deliberately NOT set. Unset, each room fills to the size its
      # mode is built for: 100 for Standard, 50 for High stakes. Setting it
      # overrides both and is the reason a "100 player" test showed 25.

      # Three was too tight to survive ordinary use. A hard-killed socket
      # holds its slot until the server's heartbeat notices, so reloading a
      # few times in a row could refuse a player at the handshake with their
      # own abandoned connections — and a refused handshake reaches the
      # browser as nothing but "closed", which reads as a broken network.
      # Two people behind one household address hit three on their own.
      - key: MAX_CONN_PER_IP
        value: "8"

      # WebSockets are not covered by the browser's same-origin policy, so
      # UNSET MEANS ANY ORIGIN IS ACCEPTED — anyone can point their own client
      # at this server. It is pinned here rather than left to the dashboard
      # precisely because the insecure state is the empty one: a blueprint sync
      # onto a fresh service would otherwise come up wide open.
      #
      # Exact string match, no trailing slash, comma separated. The apex and
      # www are different origins; if you ever stop serving www, dropping it
      # here costs nothing, but omitting one you DO serve breaks the game on it
      # while the page still loads — the socket is refused at the handshake.
      - key: ALLOWED_ORIGINS
        value: "https://engulfs.io,https://www.engulfs.io"

      # Supabase session pooler string, port 5432. Without it accounts and
      # balances live in memory and are lost on every deploy.
      - key: DATABASE_URL
        sync: false

      # Google OAuth client id. Unset simply hides the button.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # TEST_MODE=1 makes rounds start with a single ready player and fills the
      # arena with bots. Set it in the dashboard while testing; leave it out of
      # here so a blueprint sync can never enable it in production.
